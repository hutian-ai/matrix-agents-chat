services:
  synapse:
    image: matrixdotorg/synapse:v1.164.2
    restart: unless-stopped
    user: "${SYNAPSE_RUN_AS:-991:991}"
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      - "127.0.0.1:${MATRIX_PORT:-8008}:8008"
    volumes:
      - ./.local/synapse:/data
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 40
