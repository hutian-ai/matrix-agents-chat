services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mtc_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?请先运行 pnpm local:setup}"
      POSTGRES_DB: postgres
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?请先运行 pnpm local:setup}"
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/10-matrix-chat.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtc_admin -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  synapse:
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
